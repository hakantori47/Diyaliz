<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Kt/V + URR Hesaplama</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body{
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    padding: 16px;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.container{
    max-width: 1100px;
    width: 100%;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* ÜST BAŞLIK */
.title{
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    padding: 18px 20px;
    border-radius: 14px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.title span { font-size: 26px; }

/* FORMÜL KUTUSU */
.formula{
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #111827;
    padding: 16px 18px;
    border-radius: 12px;
    line-height: 1.7;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 6px 16px rgba(250, 204, 21, 0.25);
}
.formula b { display:block; margin-bottom: 4px; font-size: 15px; }
.formula .formula-text {
    font-family: 'Courier New', monospace;
    background: rgba(255,255,255,0.35);
    padding: 6px 10px;
    border-radius: 6px;
    display: inline-block;
    margin-top: 3px;
    font-size: 13px;
    word-break: break-word;
}

/* ANA GRID */
.grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.left{
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* INPUT KUTULARI */
.input-group{
    display: flex;
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    align-items: stretch;
    border: 1px solid rgba(148, 163, 184, 0.15);
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: border-color 0.2s, box-shadow 0.2s;
}
.input-group:focus-within {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

.input-group label{
    width: 42%;
    padding: 14px 12px;
    background: #334155;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    color: #e2e8f0;
}

.input-group input{
    flex: 1;
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    padding: 14px 8px;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    background: #1e293b;
    color: #f1f5f9;
}
.input-group input::placeholder { color: #64748b; }

/* + / - BUTONLARI */
.btn-arrow{
    background: #475569;
    color: white;
    border: none;
    width: 44px;
    min-width: 44px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    user-select: none;
}
.btn-arrow:hover{ background: #6366f1; }
.btn-arrow:active{ background: #4f46e5; transform: scale(0.95); }

/* ANA BUTONLAR */
button{
    margin-top: 6px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    letter-spacing: 0.3px;
}

.hesapla-btn{
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
}
.hesapla-btn:hover{
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.55);
}
.hesapla-btn:active{ transform: scale(0.98); }

.temizle-btn{
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
}
.temizle-btn:hover{
    background: linear-gradient(135deg, #dc2626, #b91c1c);
}
.temizle-btn:active{ transform: scale(0.98); }

/* SONUÇ KUTUSU */
.result-box{
    background: linear-gradient(135deg, #ecfdf5, #dcfce7);
    border-radius: 14px;
    padding: 24px 20px;
    color: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.2);
    min-height: 100%;
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-inner { width: 100%; }

.result-label {
    font-size: 14px;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.result-value{
    font-size: 46px;
    color: #16a34a;
    margin: 6px 0;
    font-weight: 800;
    line-height: 1;
}

.urr-value{
    font-size: 40px;
    color: #2563eb;
    margin: 6px 0;
    font-weight: 800;
    line-height: 1;
}

.info{
    font-size: 14px;
    color: #475569;
    font-weight: 600;
    padding: 5px 12px;
    background: rgba(255,255,255,0.7);
    border-radius: 20px;
    display: inline-block;
    margin-top: 4px;
}

hr{
    margin: 16px auto;
    border: none;
    border-top: 1px dashed #94a3b8;
    width: 60%;
}

.empty-msg {
    color: #475569;
    font-size: 15px;
    font-weight: 600;
    padding: 20px;
}

/* FOOTER */
.footer{
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    padding: 12px 0 4px 0;
    opacity: 0.85;
}

/* ---------- MOBİL UYUM ---------- */
@media(max-width: 780px){
    body { padding: 12px; }
    .container { gap: 12px; }
    .title { font-size: 17px; padding: 15px 16px; border-radius: 12px; }
    .title span { font-size: 22px; }
    .formula { font-size: 12.5px; padding: 13px 14px; line-height: 1.6; }
    .formula b { font-size: 13.5px; }
    .formula .formula-text { font-size: 11.5px; }

    .grid { grid-template-columns: 1fr; gap: 12px; }

    .input-group label {
        width: 40%;
        padding: 12px 10px;
        font-size: 13px;
    }
    .input-group input {
        padding: 12px 6px;
        font-size: 16px;
    }
    .btn-arrow {
        width: 40px;
        min-width: 40px;
        font-size: 20px;
    }

    button { padding: 14px; font-size: 16px; margin-top: 4px; }

    .result-box { padding: 20px 16px; }
    .result-value { font-size: 40px; }
    .urr-value { font-size: 34px; }
    .result-label { font-size: 12.5px; }
}

/* Çok küçük ekranlar */
@media(max-width: 380px){
    .input-group label { font-size: 12px; padding: 11px 8px; }
    .btn-arrow { width: 36px; min-width: 36px; font-size: 18px; }
    .result-value { font-size: 34px; }
    .urr-value { font-size: 30px; }
}
</style>
</head>
<body>

<div class="container">

    <div class="title">
        <span>🩺</span>
        Kt/V + URR Diyaliz Hesaplama Sistemi
    </div>

    <div class="formula">
        <b>📐 Kt/V Formülü:</b>
        <span class="formula-text">-ln((BUN Post / BUN Pre) - (0.008 × Saat)) + ((4 - (3.5 × BUN Post / BUN Pre)) × UF Vol / Ağırlık)</span>
        <br><br>
        <b>📊 URR Formülü:</b>
        <span class="formula-text">((BUN Pre - BUN Post) / BUN Pre) × 100</span>
    </div>

    <div class="grid">

        <div class="left">

            <div class="input-group">
                <label>BUN Pre</label>
                <button class="btn-arrow" onclick="degistir('bunPre', -1)">−</button>
                <input type="number" id="bunPre" step="0.01" placeholder="0" inputmode="decimal">
                <button class="btn-arrow" onclick="degistir('bunPre', 1)">+</button>
            </div>

            <div class="input-group">
                <label>BUN Post mg/dl</label>
                <button class="btn-arrow" onclick="degistir('bunPost', -1)">−</button>
                <input type="number" id="bunPost" step="0.01" placeholder="0" inputmode="decimal">
                <button class="btn-arrow" onclick="degistir('bunPost', 1)">+</button>
            </div>

            <div class="input-group">
                <label>Saat</label>
                <button class="btn-arrow" onclick="degistir('saat', -1)">−</button>
                <input type="number" id="saat" step="0.01" placeholder="0" inputmode="decimal">
                <button class="btn-arrow" onclick="degistir('saat', 1)">+</button>
            </div>

            <div class="input-group">
                <label>UF Vol (Litre)</label>
                <button class="btn-arrow" onclick="degistir('uf', -1)">−</button>
                <input type="number" id="uf" step="0.01" placeholder="0" inputmode="decimal">
                <button class="btn-arrow" onclick="degistir('uf', 1)">+</button>
            </div>

            <div class="input-group">
                <label>Ağırlık (kg)</label>
                <button class="btn-arrow" onclick="degistir('agirlik', -1)">−</button>
                <input type="number" id="agirlik" step="0.01" placeholder="0" inputmode="decimal">
                <button class="btn-arrow" onclick="degistir('agirlik', 1)">+</button>
            </div>

            <button class="hesapla-btn" onclick="otomatikHesapla()">🧮 Hesapla</button>
            <button class="temizle-btn" onclick="temizle()">🗑️ Temizle</button>

        </div>

        <div class="result-box" id="sonuc">
            <div class="empty-msg">Sonuçları görmek için tüm alanları doldurun</div>
        </div>

    </div>

    <div class="footer">
        Hakan tarafından yapılmıştır
    </div>

</div>

<script>

const fieldOrder = ["bunPre", "bunPost", "saat", "uf", "agirlik"];

fieldOrder.forEach(function(id, index) {
    let inputElement = document.getElementById(id);
    inputElement.addEventListener("input", otomatikHesapla);

    inputElement.addEventListener("keydown", function(e) {
        if (e.key === "ArrowDown") {
            e.preventDefault();
            if (index + 1 < fieldOrder.length) {
                let nextInput = document.getElementById(fieldOrder[index + 1]);
                nextInput.focus();
                nextInput.select();
            }
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            if (index - 1 >= 0) {
                let prevInput = document.getElementById(fieldOrder[index - 1]);
                prevInput.focus();
                prevInput.select();
            }
        }
    });
});

function degistir(id, miktar) {
    let input = document.getElementById(id);
    let mevcutDeger = parseFloat(input.value);
    if (isNaN(mevcutDeger)) mevcutDeger = 0;
    let yeniDeger = mevcutDeger + miktar;
    if (yeniDeger < 0) yeniDeger = 0;
    input.value = yeniDeger;
    otomatikHesapla();
}

function otomatikHesapla(){
    let bunPre = parseFloat(document.getElementById("bunPre").value);
    let bunPost = parseFloat(document.getElementById("bunPost").value);
    let saat = parseFloat(document.getElementById("saat").value);
    let uf = parseFloat(document.getElementById("uf").value);
    let agirlik = parseFloat(document.getElementById("agirlik").value);

    if(isNaN(bunPre) || isNaN(bunPost) || isNaN(saat) || isNaN(uf) || isNaN(agirlik)){
        document.getElementById("sonuc").innerHTML = '<div class="empty-msg">Sonuçları görmek için tüm alanları doldurun</div>';
        return;
    }

    if(bunPre === 0 || agirlik === 0){
        document.getElementById("sonuc").innerHTML = '<div class="empty-msg">Geçersiz değer girdiniz.</div>';
        return;
    }

    let oran = bunPost / bunPre;
    let ktv = -Math.log(oran - (0.008 * saat)) + ((4 - (3.5 * oran)) * uf / agirlik);
    let urr = ((bunPre - bunPost) / bunPre) * 100;

    if(isNaN(ktv) || !isFinite(ktv)){
        document.getElementById("sonuc").innerHTML = '<div class="empty-msg">Geçersiz değer girdiniz.</div>';
        return;
    }

    let ktvDurum = ktv >= 1.4 ? "✅ Kt/V iyi" : (ktv >= 1.2 ? "⚠️ Kt/V sınırda" : "❌ Kt/V düşük");
    let urrDurum = urr >= 65 ? "✅ URR yeterli" : "❌ URR düşük";

    document.getElementById("sonuc").innerHTML = `
        <div class="result-inner">
            <div class="result-label">Kt/V Sonucu</div>
            <div class="result-value">${ktv.toFixed(2)}</div>
            <div class="info">${ktvDurum}</div>
            <hr>
            <div class="result-label">URR Sonucu</div>
            <div class="urr-value">%${urr.toFixed(2)}</div>
            <div class="info">${urrDurum}</div>
        </div>
    `;
}

function temizle(){
    document.getElementById("bunPre").value = "";
    document.getElementById("bunPost").value = "";
    document.getElementById("saat").value = "";
    document.getElementById("uf").value = "";
    document.getElementById("agirlik").value = "";
    document.getElementById("sonuc").innerHTML = '<div class="empty-msg">Sonuçları görmek için tüm alanları doldurun</div>';
}

</script>

</body>
</html>
